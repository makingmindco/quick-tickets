<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - QuickTickets</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f1f5f9; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .mensagem { font-size: 14px; color: #64748b; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-top: 0; color: #0f172a;">Criar Nova Senha</h2>
        <p class="mensagem">Digite sua nova senha abaixo.</p>
        <input type="password" id="novaSenha" placeholder="Nova senha" required>
        <input type="password" id="confirmaSenha" placeholder="Confirme a nova senha" required>
        <button id="btnSalvar">Salvar Senha</button>
    </div>

    <script>
        // Pega o token mágico que o Node.js colocou na URL (ex: ?token=abcdef...)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Se alguém tentar abrir a tela direto, sem o token, o sistema expulsa
        if (!token) {
            alert('Acesso negado. Use o link de recuperação enviado para o seu e-mail.');
            window.location.href = 'login.html';
        }

        document.getElementById('btnSalvar').addEventListener('click', async () => {
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            if (novaSenha !== confirmaSenha) {
                return alert('As senhas não coincidem!');
            }
            if (novaSenha.length < 4) {
                return alert('A senha deve ser mais segura (mínimo de 4 caracteres).');
            }

            try {
                // Envia a nova senha e o token para a Rota 2 que criamos no Node.js
                const resposta = await fetch('http://localhost:3000/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, novaSenha })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    alert(dados.mensagem);
                    window.location.href = 'login.html'; // Manda de volta pro Login
                } else {
                    alert(dados.erro); // Exibe o erro se o token já estiver expirado
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Erro ao comunicar com o servidor.');
            }
        });
    </script>
</body>
</html>
